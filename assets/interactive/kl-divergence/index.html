      <label class="control" for="mu-q-slider">
        <span>mu_Q</span>
        <input
          id="mu-q-slider"
          data-testid="mu-q-slider"
          type="range"
          min="-3.5"
          max="3.5"
          step="0.05"
          value="0"
        >
        <output id="mu-q-output" for="mu-q-slider">0.00</output>
      </label>

    <script>
      (() => {
        const plot = document.getElementById("kl-divergence-plot");
        const slider = document.getElementById("mu-q-slider");
        const output = document.getElementById("mu-q-output");
        const status = document.getElementById("kl-status");
        const x = Array.from(plot._fullData[0].x);
        const p = Array.from(plot._fullData[0].y);
        const epsilon = 1e-12;

        function normalPdf(value, mean) {
          return Math.exp(-0.5 * (value - mean) ** 2) / Math.sqrt(2 * Math.PI);
        }

        function trapezoid(values) {
          let area = 0;
          for (let index = 1; index < values.length; index += 1) {
            area += 0.5 * (values[index - 1] + values[index]) * (x[index] - x[index - 1]);
          }
          return area;
        }

        function update() {
          const meanQ = Number(slider.value);
          const q = x.map((value) => normalPdf(value, meanQ));
          const contribution = p.map(
            (value, index) => value * Math.log((value + epsilon) / (q[index] + epsilon)),
          );
          const divergence = trapezoid(contribution);
          const minimum = Math.min(...contribution);
          const maximum = Math.max(...contribution);
          const lowerBound = Math.min(-0.1, minimum * 1.2);
          const upperBound = Math.max(0.2, maximum * 1.2);

          output.value = meanQ.toFixed(2);
          output.textContent = meanQ.toFixed(2);
          status.textContent = `mu_Q = ${meanQ.toFixed(2)}, D_KL(P || Q) = ${divergence.toFixed(3)}`;
          Plotly.restyle(plot, { y: [q, contribution] }, [1, 2]);
          Plotly.relayout(plot, {
            "yaxis2.range": [lowerBound, upperBound],
          });
        }

        slider.addEventListener("input", update);
      })();
    </script>
